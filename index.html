<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="logo.png">

	<title>FoodReporter</title>
	
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

	<!-- Marker Cluster plugin -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
	<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

	<style>
		html, body {
			height: 100%;
			width: 100%;
			margin: 0;
			padding: 0;
		}

		.leaflet-container {
			height: 100%;
			width: 100%;
		}

		#top-header {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 30px;
			background-color: white;
			color: black;
			text-align: center;
			padding: 10px 0;
			font-size: 1.2em;
			font-weight: bold;
			z-index: 2000;
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 10px;
		}

		.header-logo {
			height: 50px;
			width: 50px;
			object-fit: cover;
			border-radius: 50%;
			overflow: hidden;
			background-color: transparent;
		}

		body {
			display: flex;
			flex-direction: row;
			height: 100%;
		}

		#sidebar {
			width: 300px;
			background-color: white;
			padding: 20px;
			box-shadow: 2px 0 5px rgba(0,0,0,0.2);
			z-index: 1000;
			overflow-y: auto;
			transition: transform 0.3s ease;
			margin-top: 50px; /* offset for fixed header */
		}

		.sidebar-content h1 {
			margin-top: 0;
			font-size: 1.8em;
		}

		#map {
			flex: 1;
			height: calc(100% - 50px);
			margin-top: 50px;
		}

		#sidebar a {
			color: #0077cc;
			text-decoration: none;
		}

		#sidebar a:hover {
			text-decoration: underline;
		}

		@media (max-width: 768px) {
			body {
				flex-direction: column;
			}

			#sidebar {
				position: fixed;
				top: 50px;
				left: 0;
				height: calc(100% - 50px);
				transform: translateX(-100%);
				margin-top: 0;
			}

			#sidebar.open {
				transform: translateX(0);
			}
		}
	</style>
</head>

<body>
	<div id="top-header">
		<img src="logo.png" alt="Logo" class="header-logo">
		<span>Allegheny County Food Reporter</span>
		<img src="logo.png" alt="Logo" class="header-logo">
	</div>

	<!-- Sidebar -->
	<div id="sidebar">
		<div class="sidebar-content">
			<input type="text" id="search-box" placeholder="Search facilities..." 
			       style="width:80%; padding: 8px 12px 8px 8px; margin-bottom: 10px; font-size: 1em;">
			
			<div id="suggestions" style="position: relative;">
				<ul id="suggestion-list" 
				    style="list-style: none; padding-left: 0; margin-top: 0; border: 1px solid #ccc; 
				           max-height: 150px; overflow-y: auto; background: white; display: none; 
				           position: absolute; z-index: 1000; width: 80%; font-size: 1em;">
				</ul>
			</div>

			<hr>
			<h3>Filter by Severity</h3>
			<label><input type="checkbox" class="severity-filter" value="High" checked> High</label><br>
			<label><input type="checkbox" class="severity-filter" value="Medium" checked> Medium</label><br>
			<label><input type="checkbox" class="severity-filter" value="Low" checked> Low</label><br>
			<label><input type="checkbox" class="severity-filter" value="None" checked> Other</label>

			<hr>
			<p><strong>UNDER DEVELOPMENT</strong></p>
			<p>Food safety violations reported in the past year by the Allegheny County Health Department.</p>
			<p>Click a marker to view details and find links to full inspection reports.</p>
			<p>Data updated daily.</p>
			<hr>
			<p>
				<a href="https://github.com/dravenbc/food-reporter" target="_blank">GitHub Repo</a> |
				<a href="https://www.linkedin.com/in/draven-bechtel-clark-30b633176" target="_blank">Connect on LinkedIn</a>
			</p>
		</div>
	</div>

	<div id="map"></div>

<script>
	// Initialize map
	const map = L.map('map', { zoomControl: false }).setView([40.4387, -79.9972], 10);
	L.control.zoom({ position: 'topright' }).addTo(map);

	const tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
		maxZoom: 19,
		attribution: 'Tiles &copy; Esri'
	}).addTo(map);

	let allFeatures = [];
	// ✅ Default cluster style (no custom iconCreateFunction)
	let markers = L.markerClusterGroup();
	let geoJsonLayer;

	const searchBox = document.getElementById('search-box');
	const suggestionList = document.getElementById('suggestion-list');
	let activeIndex = -1;

	// Normalize text
	function normalize(str) {
		return str.toLowerCase()
			.replace(/[^a-z0-9\s]/gi, '')
			.replace(/\s+/g, ' ')
			.trim();
	}

	// Fuzzy match
	function fuzzyMatch(term, target) {
		term = normalize(term);
		target = normalize(target);
		if (target.includes(term)) return true;
		const termParts = term.split(' ');
		return termParts.every(part => target.includes(part));
	}

	// Get active severity filters
	function getActiveSeverities() {
		return Array.from(document.querySelectorAll('.severity-filter:checked'))
			.map(cb => cb.value);
	}

	// Render markers
	function renderMarkers(filteredFeatures) {
		if (geoJsonLayer) {
			markers.removeLayer(geoJsonLayer);
		}

		const activeSeverities = getActiveSeverities();

		geoJsonLayer = L.geoJSON(filteredFeatures, {
			pointToLayer: function (feature, latlng) {
				// Severity
				let severity = 'None';
				const props = feature.properties;
				if (props.high === 'T') severity = 'High';
				else if (props.medium === 'T') severity = 'Medium';
				else if (props.low === 'T') severity = 'Low';

				if (!activeSeverities.includes(severity)) return null;

				const marker = L.marker(latlng);
				let popupContent = `<strong>${props.facility_name_inspection || 'No Name'}</strong><br/>`;

				let inspectDate = props.inspect_dt;
				if (inspectDate) {
					const dateObj = new Date(inspectDate);
					inspectDate = dateObj.toLocaleDateString('en-US', {
						year: 'numeric',
						month: 'long',
						day: 'numeric'
					});
				} else {
					inspectDate = 'No Inspection Date';
				}
				popupContent += `<p><strong>Inspection Date:</strong> ${inspectDate}</p>`;
				popupContent += `<p><strong>Severity:</strong> ${severity}</p>`;
				popupContent += `<p><strong>Violation:</strong> ${props.description_new || 'No Description'}</p>`;
				if (props.url) popupContent += `<p><a href="${props.url}" target="_blank">View Report</a></p>`;

				marker.bindPopup(popupContent);
				return marker;
			}
		});

		markers.addLayer(geoJsonLayer);
	}

	// Zoom to a feature
	function zoomToFeature(feature) {
		const coords = feature.geometry.coordinates;
		if (coords && coords.length === 2) {
			map.setView([coords[1], coords[0]], 17);
		}
	}

	// Update suggestions
	function updateSuggestions(searchTerm) {
		const filtered = allFeatures.filter(feature => {
			const name = feature.properties.facility_name_inspection || '';
			return fuzzyMatch(searchTerm, name);
		});
		renderMarkers(filtered);

		const suggestions = filtered
			.map(f => f.properties.facility_name_inspection)
			.filter((v, i, a) => v && a.indexOf(v) === i)
			.slice(0, 10);

		suggestionList.innerHTML = '';
		activeIndex = -1;

		if (searchTerm && suggestions.length > 0) {
			suggestions.forEach((name, index) => {
				const li = document.createElement('li');
				li.textContent = name;
				li.setAttribute('data-index', index);
				li.style.padding = '5px 10px';
				li.style.cursor = 'pointer';
				li.addEventListener('mouseenter', () => setActive(index));
				li.addEventListener('mouseleave', () => setActive(-1));
				li.addEventListener('click', () => selectSuggestion(name));
				suggestionList.appendChild(li);
			});
			suggestionList.style.display = 'block';
		} else {
			suggestionList.style.display = 'none';
		}
	}

	function setActive(index) {
		const items = suggestionList.querySelectorAll('li');
		items.forEach((item, i) => {
			item.style.backgroundColor = i === index ? '#eee' : '#fff';
		});
		activeIndex = index;
	}

	function selectSuggestion(name) {
		searchBox.value = name;
		suggestionList.style.display = 'none';
		const selected = allFeatures.filter(f =>
			normalize(f.properties.facility_name_inspection || '') === normalize(name)
		);
		renderMarkers(selected);
		if (selected.length > 0) zoomToFeature(selected[0]);
		searchBox.dispatchEvent(new Event('input'));
	}

	// Event listeners
	searchBox.addEventListener('input', function () {
		updateSuggestions(this.value);
	});
	searchBox.addEventListener('keydown', function (e) {
		const items = suggestionList.querySelectorAll('li');
		if (e.key === 'ArrowDown') {
			if (activeIndex < items.length - 1) setActive(activeIndex + 1);
			e.preventDefault();
		} else if (e.key === 'ArrowUp') {
			if (activeIndex > 0) setActive(activeIndex - 1);
			e.preventDefault();
		} else if (e.key === 'Enter') {
			if (activeIndex >= 0) {
				e.preventDefault();
				selectSuggestion(items[activeIndex].textContent);
			}
		}
	});
	searchBox.addEventListener('blur', () => {
		setTimeout(() => suggestionList.style.display = 'none', 150);
	});
	searchBox.addEventListener('focus', () => {
		if (searchBox.value.trim() !== '') updateSuggestions(searchBox.value);
	});

	// Filter checkbox event
	document.querySelectorAll('.severity-filter').forEach(cb => {
		cb.addEventListener('change', () => {
			updateSuggestions(searchBox.value); // rerun with current search
		});
	});

	// Load GeoJSON
	fetch('inspections.geojson')
		.then(response => response.json())
		.then(data => {
			allFeatures = data.features;
			renderMarkers(allFeatures);
			map.addLayer(markers);
		})
		.catch(error => console.error('Error loading the GeoJSON file:', error));
</script>
</body>
</html>
